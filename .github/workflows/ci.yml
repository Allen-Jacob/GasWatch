name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Validate configuration
        env:
          HOME_LATITUDE: "46.8139"
          HOME_LONGITUDE: "-71.2080"
        run: python -c 'from app.config import Settings; Settings()'
      - run: docker build -t gaswatch:test .

